<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Simple Kanban Board</h1>

      <div class="board">
        <div class="list" id="list1">
          <div class="list-header">
            <h2>To Do</h2>
            <button
              class="add-card"
              type="button"
              aria-label="Add task to To Do"
              title="Add task"
            >
              +
            </button>
          </div>
          <div class="card" draggable="true" id="card1">Card 1</div>
          <div class="card" draggable="true" id="card2">Card 2</div>
        </div>

        <div class="list" id="list2">
          <div class="list-header">
            <h2>In Progress</h2>
            <button
              class="add-card"
              type="button"
              aria-label="Add task to In Progress"
              title="Add task"
            >
              +
            </button>
          </div>
          <div class="card" draggable="true" id="card3">Card 3</div>
          <div class="card" draggable="true" id="card4">Card 4</div>
        </div>

        <div class="list" id="list3">
          <div class="list-header">
            <h2>Done</h2>
            <button
              class="add-card"
              type="button"
              aria-label="Add task to Done"
              title="Add task"
            >
              +
            </button>
          </div>
          <div class="card" draggable="true" id="card5">Card 5</div>
          <div class="card" draggable="true" id="card6">Card 6</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
